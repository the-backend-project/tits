# Project settings for Mistral Vibe. Vibe loads them only when the folder is trusted. Put your own settings in
# ~/.vibe/config.toml.

[tools.bash]
# Builds with tests take longer than Vibe's default of 300 seconds.
default_timeout = 1800
max_timeout_seconds = 3600

# Commands that run without asking. A command matches when it equals an entry or starts with an entry followed by a
# space. This list replaces Vibe's default list, so the first two lines repeat the defaults.
allowlist = [
  "cd", "echo", "git diff", "git log", "git status", "tree", "whoami",
  "basename", "cat", "comm", "cut", "date", "diff", "dirname", "du", "file", "find", "fmt", "fold", "grep", "head",
  "join", "less", "ls", "md5sum", "more", "nl", "od", "paste", "pwd", "readlink", "sha1sum", "sha256sum", "shasum",
  "sort", "stat", "sum", "tac", "tail", "tr", "uname", "uniq", "wc", "which",
  "mvn",
  "bin/serve-docs.sh --build",
  "bin/start-mssql.sh",
  "bin/start-postgres.sh",
  "git show",
  "git branch --list",
  "git worktree list",
  "git remote -v",
  "git fetch",
  "gh issue view",
  "gh issue list",
  "gh pr view",
  "gh pr list",
  "gh pr diff",
  "gh pr checks",
  "gh run view",
  "gh run list",
  "gh repo view",
]

# Commands that are refused. This list replaces Vibe's default list, so the first two lines repeat the defaults.
# Matching by prefix only catches deploying when `deploy` comes right after `mvn`.
denylist = [
  "gdb", "pdb", "passwd",
  "nano", "vim", "vi", "emacs", "bash -i", "sh -i", "zsh -i", "fish -i", "dash -i", "screen", "tmux",
  "mvn deploy",
]
