applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
default_timeout = 1800
max_timeout_seconds = 3600
allowlist = [
    "basename",
    "bin/serve-docs.sh --build",
    "bin/start-mssql.sh",
    "bin/start-postgres.sh",
    "cat",
    "cd",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "gh issue list",
    "gh issue view",
    "gh pr checks",
    "gh pr diff",
    "gh pr list",
    "gh pr view",
    "gh repo view",
    "gh run list",
    "gh run view",
    "git branch --list",
    "git diff",
    "git fetch",
    "git log",
    "git remote -v",
    "git show",
    "git status",
    "git worktree list",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "mvn",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
    "whoami",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
    "mvn deploy",
]
