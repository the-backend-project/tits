# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Build and verify

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/azure-sql-edge:2.0.0
        ports:
          - 11433:1433
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: A_Str0ng_Required_Password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize test database
        run: |
          docker run --rm \
            --network ${{ job.services.mssql.network }} \
            --env=SA_PASSWORD=A_Str0ng_Required_Password \
            "$(docker build -q test/mssql)"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      - name: Build Java artifacts and run any verifications
        run: mvn -B verify --file pom.xml -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=true

  # Finds out which native images the pull request affects. Both apps are built from the same modules, so only changes
  # to modules they do not depend on (documentation, templates, test-api, deploy) or to the other app skip a build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hello-world: ${{ steps.filter.outputs.hello-world }}
      identity-provider: ${{ steps.filter.outputs.identity-provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # The checked out commit merges the pull request into main, so its first parent is main.
      - name: Find the affected native images
        id: filter
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          shared='^(pom\.xml|\.mvn/|\.dockerignore|\.github/workflows/build-verify\.yml|core/|database-[^/]+/|http-inbox/|http-outbox/|diagram/)'
          for app in hello-world:apps/hello-world/ identity-provider:apps/identity-provider/; do
            if grep -qE "$shared|^${app#*:}" <<< "$files"; then affected=true; else affected=false; fi
            echo "${app%%:*}=$affected" | tee -a "$GITHUB_OUTPUT"
          done

  # The native images are built in quick build mode (-Ob), as these jobs only check that they run.
  hello-world:
    needs: changes
    if: needs.changes.outputs.hello-world == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the hello world native image
        working-directory: apps/hello-world
        run: docker compose build --build-arg NATIVE_IMAGE_OPTS=-Ob migrate
      - name: Run it with its database
        working-directory: apps/hello-world
        run: docker compose up --detach --no-build
      - name: Check that it says hello
        run: |
          for i in $(seq 1 120); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep 'Hello, world!'
      - name: Show the logs
        if: always()
        working-directory: apps/hello-world
        run: docker compose logs

  identity-provider:
    needs: changes
    if: needs.changes.outputs.identity-provider == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the identity provider native image
        working-directory: apps/identity-provider
        run: docker compose build --build-arg NATIVE_IMAGE_OPTS=-Ob migrate
      - name: Run it with its database
        working-directory: apps/identity-provider
        run: |
          export SIGNING_KEYS="$(docker run --rm tits-identity-provider generate-key)"
          docker compose up --detach --no-build
      - name: Check that it issues tokens and registers clients
        run: |
          for i in $(seq 1 120); do curl -sf localhost:8080/health && break; sleep 1; done
          token=$(curl -sf -u admin:A_local_bootstrap_secret_of_32_characters -d grant_type=client_credentials \
            localhost:8080/token | jq -er .access_token)
          secret=$(curl -sf -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"client_id": "ci", "scope": "a b"}' localhost:8080/clients | jq -er .client_secret)
          curl -sf -u "ci:$secret" -d grant_type=client_credentials -d scope=a localhost:8080/token | jq -e '.scope == "a"'
          curl -sf localhost:8080/.well-known/jwks.json | jq -e '.keys | length == 1'
      - name: Show the logs
        if: always()
        working-directory: apps/identity-provider
        run: docker compose logs

  build-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        ports:
          - 15432:5432
        env:
          POSTGRES_PASSWORD: A_Str0ng_Required_Password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize test database
        env:
          PGPASSWORD: A_Str0ng_Required_Password
        run: |
          until psql -h localhost -p 15432 -U postgres -c 'SELECT 1' > /dev/null 2>&1; do
            echo "postgres init: server not yet ready"
            sleep 1
          done
          psql -h localhost -p 15432 -U postgres -v ON_ERROR_STOP=1 -f test/postgres/init.sql
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      # The hello world demo runs on SQL Server only
      - name: Build Java artifacts and run any verifications on PostgreSQL
        run: mvn -B verify --file pom.xml -pl '!apps/hello-world' -Ddatabase=pgsql-jdbc -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=true

  build-postgres-r2dbc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        ports:
          - 15432:5432
        env:
          POSTGRES_PASSWORD: A_Str0ng_Required_Password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize test database
        env:
          PGPASSWORD: A_Str0ng_Required_Password
        run: |
          until psql -h localhost -p 15432 -U postgres -c 'SELECT 1' > /dev/null 2>&1; do
            echo "postgres init: server not yet ready"
            sleep 1
          done
          psql -h localhost -p 15432 -U postgres -v ON_ERROR_STOP=1 -f test/postgres/init.sql
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      # The hello world demo runs on SQL Server only
      - name: Build Java artifacts and run any verifications on PostgreSQL through R2DBC
        run: mvn -B verify --file pom.xml -pl '!apps/hello-world' -Ddatabase=pgsql-r2dbc -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=true

  build-postgres-vertx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        ports:
          - 15432:5432
        env:
          POSTGRES_PASSWORD: A_Str0ng_Required_Password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize test database
        env:
          PGPASSWORD: A_Str0ng_Required_Password
        run: |
          until psql -h localhost -p 15432 -U postgres -c 'SELECT 1' > /dev/null 2>&1; do
            echo "postgres init: server not yet ready"
            sleep 1
          done
          psql -h localhost -p 15432 -U postgres -v ON_ERROR_STOP=1 -f test/postgres/init.sql
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      # The hello world demo runs on SQL Server only
      - name: Build Java artifacts and run any verifications on PostgreSQL through the Vert.x client
        run: mvn -B verify --file pom.xml -pl '!apps/hello-world' -Ddatabase=pgsql-vertx -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=true
