name: Publish package to GitHub Packages
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      # Modules depending on each other at a release version are subject to trusted checksum verification, but
      # their checksums can not be known in advance. Missing checksums are therefore allowed during deploy, while
      # checksum mismatches still fail the build.
      - name: Publish package
        run: >-
          mvn -B versions:set -DnewVersion=${{ github.event.release.tag_name }} -DgenerateBackupPoms=false &&
          mvn -B deploy -DskipTests -Daether.artifactResolver.postProcessor.trustedChecksums.failIfMissing=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
